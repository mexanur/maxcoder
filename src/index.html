<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Website</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 text-center py-8">
    <!-- Topbar -->
    <nav class="bg-gray-900 text-white p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold">My Simple Website</h1>
        <div class="flex items-center">
            <button class="p-2 rounded-full hover:bg-gray-800 focus:outline-none focus:bg-gray-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>
    </nav>

    <!-- Header -->
    <header class="bg-white p-4">
        <h1 class="text-3xl font-bold text-gray-900">Welcome to My Simple Website</h1>
        <p class="text-lg mb-8 text-gray-700">This is a basic example of a website built with HTML, CSS, and Tailwind.</p>
    </header>

    <!-- Main Content -->
    <div class="max-w-md mx-auto p-6 bg-white rounded shadow-md">
        <h2 class="text-xl font-bold mb-4">About Me</h2>
        <p class="text-gray-700">I am a software engineer with experience in building web applications.</p>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white p-4 text-center">
        <p>&copy; 2023 My Simple Website. All rights reserved.</p>
    </footer>
</body>
</html>
